markdown: >-
  ## Overview


  Zoom is one of the most widely used webinar and virtual meeting platforms,
  trusted by nonprofits for donor briefings, board meetings, trainings, and
  large-scale virtual events.


  ## Features


  - Webinars and meetings for small or large audiences

  - Screen sharing, breakout rooms, polls, and Q&A

  - Reliable video and audio quality across devices

  - Recording and on-demand playback

  - Familiar, low-friction join experience for attendees

  - Nonprofit discounts available through Zoom for Nonprofits


  ## Pricing


  Zoom offers nonprofit discounts through Zoom for Nonprofits, with pricing
  based on plan type and webinar size. Organizations must apply to confirm
  eligibility.


  ## Integrations


  Zoom connects with major CRMs, calendars, and marketing tools—and works
  seamlessly with Givebutter livestreaming.


  ## Deployment


  Cloud-based SaaS platform.
