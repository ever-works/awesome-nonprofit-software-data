markdown: >-
  ## Overview


  Double the Donation enables nonprofits to streamline and promote corporate
  donation matching to their donors.


  ## Features


  - Streamlined search field

  - Automated emails

  - Auto-submission


  ## Pricing


  Double the Donation's pricing starts at $999 per year for eligible small
  nonprofits.


  ## Integrations


  Double the Donation integrates with most major donation forms and fundraising
  tools, including Givebutter.


  ## Deployment


  Cloud-based SaaS platform.
