markdown: >-
  ## Overview


  Xero is a cloud-based accounting platform designed to serve nonprofits and
  charities alongside small to medium enterprises. It provides real-time
  financial dashboards showing donations, grants, and expenses, built-in payroll
  functionality, and a wide ecosystem of integrations to tie fundraising,
  volunteer, and CRM systems into one unified finance view.


  ## Key Features


  - Real-time financial dashboard showing donations, grants, and expenses

  - Built-in payroll functionality: automatic wage calculations, VAT/deductions,
  payslips, staff self-service

  - Strong integrations: more than 1,000 third-party apps for fundraising, CRM,
  and volunteer systems


  ## Pricing


  Three pricing tiers: $29/month (Starter), $46/month (Standard), and $69/month
  (Premium). A discount for charity status is available.


  ## Integrations


  More than 1,000 third-party apps for fundraising, CRM, and volunteer systems.


  ## Use Cases


  Simplifies accounting and payroll for organizations that may not have large
  finance teams, with grant tracking, restricted funds, and payroll compliance.
