markdown: >-
  ## Overview


  Decidim is a free open-source participatory democracy framework for cities and
  organizations. It enables citizen participation, proposal creation, debate,
  and decision-making processes for municipalities and organizations.


  ## Key Features


  - Participatory democracy processes

  - Citizen proposals and debates

  - Decision-making tools

  - Meeting and assembly management

  - Open source (self-hosted)


  ## Pricing


  Free and open-source under the GNU Affero General Public License v3.


