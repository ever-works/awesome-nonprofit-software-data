name: Microsoft Teams
description: Microsoft Teams is a team chat and collaboration app that lets
  nonprofit team members connect through text channels, audio calls, video
  calls, and virtual meetings from anywhere. It supports real-time
  collaboration, file sharing, tasks, live polls, and meeting transcripts, and
  fits alongside Microsoft 365 document management and file-sharing tools.
  Pricing starts at $4 per user per month, or Teams is included in Microsoft 365
  subscriptions starting at $6 per user per month.
