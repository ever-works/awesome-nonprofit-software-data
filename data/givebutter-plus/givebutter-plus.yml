name: Givebutter Plus
description: "Givebutter Plus is the paid tier of Givebutter's fundraising and
  donor management platform, adding project management and productivity features
  for managing fundraising efforts in one place. It includes pre-built and
  custom workflows, task management, customization with tags, fields, and notes,
  file uploads, data visualizations, an advanced drag-and-drop email editor, and
  built-in text messaging. Pricing: core Givebutter features are free to use,
  and Givebutter Plus starts at $29 per month, scaling with the number of
  contacts."
source_url: https://givebutter.com/
