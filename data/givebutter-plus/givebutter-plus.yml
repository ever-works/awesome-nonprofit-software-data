markdown: >-
  ## Overview


  Givebutter Plus enhances Givebutter's fundraising platform with productivity
  features, making it easier to manage all fundraising efforts in one place.


  ## Key Features


  - Pre-built and custom workflows

  - Task management

  - Customization with tags, fields, and notes

  - File uploads

  - Data visualizations

  - Advanced drag-and-drop email editor

  - Built-in text messaging for reminders, appeals, and real-time updates


  ## Pricing


  Givebutter's core fundraising features are free to use. Givebutter Plus starts
  at $29 per month and scales depending on the number of contacts.


  ## Integrations


  Givebutter integrates with hundreds of other tools through its integrations
  library.


  ## Use Cases


  Managing fundraising efforts, task tracking, donor insights, email campaigns,
  and text messaging for reminders and appeals.
