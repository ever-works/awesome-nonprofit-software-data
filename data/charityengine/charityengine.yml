markdown: >-
  ## Overview


  CharityEngine is an all-in-one donor management and CRM solution built
  specifically for nonprofits that want to streamline their fundraising,
  marketing, and operations.


  ## Features


  - Unified CRM, fundraising, and email marketing platform

  - Donation processing and recurring gift management

  - Event management and ticketing

  - Marketing automation and segmentation

  - Payment processing and donor self-service portal

  - Advanced reporting and analytics


  ## Pricing


  CharityEngine offers several packages with pricing that varies based on the
  features you need and your organization's size. Request a demo to receive a
  customized quote that fits your goals and budget.


  ## Integrations


  - QuickBooks

  - Google Analytics

  - Mailchimp

  - Custom API integrations


  ## Deployment


  Cloud-based SaaS platform.
