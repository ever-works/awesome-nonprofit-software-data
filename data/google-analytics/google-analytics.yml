name: Google Analytics
description: Google Analytics is a free web analytics platform that helps
  nonprofits understand where visitors come from, how they find the site, and
  what they do on it. It provides traffic and visitor analysis, audience
  insights, visitor action data, marketing campaign success measurement, and
  e-commerce tracking. It can integrate with nearly any website software or
  platform, and requires only an account and connection to the nonprofit website
  to get started.
