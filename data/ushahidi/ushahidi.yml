markdown: >-
  ## Overview


  Ushahidi is an open-source geo data content management and collection system.
  It enables crowdsourced information collection, mapping, and visualization for
  crisis response, human rights monitoring, election monitoring, and community
  reporting.


  ## Key Features


  - Crowdsourced data collection

  - Geospatial mapping and visualization

  - Crisis response and monitoring

  - Mobile and web reporting

  - Open source (self-hosted)


  ## Pricing


  Free and open-source under the GNU Affero General Public License v3.


