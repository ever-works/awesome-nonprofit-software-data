markdown: >-
  ## Overview


  QuickBooks is a well-known accounting software solution that many nonprofits
  adopt because it combines accessible financial management, cash-flow tracking,
  invoicing, and expense monitoring, and can scale to add payroll services as
  the organization grows. It is well-suited for smaller or mid-sized charities
  seeking professional-grade accounting without a large finance team.


  ## Key Features


  - User-friendly interface and mobile app access

  - Solid reporting tools: track cash flow, expenses by project/fund,
  donor/grant money

  - Banking and payment system integrations for invoices, donations, and
  reimbursements

  - Scalable payroll services


  ## Pricing


  Regular monthly pricing in the U.S. begins at around $38/month for very basic
  versions. Through the nonprofit partner program (via TechSoup), eligible
  501(c)(3) organizations can access substantially reduced rates, for example a
  one-year admin fee of ~$75 for QuickBooks Online Plus versus regular many
  hundreds per month.


  ## Integrations


  Banking and payment system integrations; Givebutter Plus has a built-in
  QuickBooks Online integration for exporting donation data.


  ## Use Cases


  Professional-grade accounting for smaller and mid-sized charities, cash-flow
  tracking, invoicing, expense monitoring, and payroll as the organization
  grows.
