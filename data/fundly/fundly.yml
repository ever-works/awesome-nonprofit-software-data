markdown: >-
  ## Overview


  Fundly is a crowdfunding platform that grants individuals and entities the
  capacity to curate online campaigns for a diverse range of causes, including
  medical expenses, education, and community-based projects.


  ## Features


  - Volunteer interest form widget

  - Donation widget

  - Social sharing

  - Pledge campaigns (add-on)

  - Sterling volunteers integration


  ## Pricing


  Custom pricing


  ## Deployment


  Cloud-based (SaaS)
