markdown: >-
  ## Overview


  monday.com is a cloud-based project management software that helps streamline
  processes, increase productivity, automate tasks, and provide functionality
  for teams running fundraising campaigns.


  ## Key Features


  - Donation pipelines

  - Automated emails and texts

  - Donor profiles

  - Volunteer recruitment forms

  - Grant management

  - Task management

  - End-to-end project management


  ## Pricing


  monday.com offers a generous discount for nonprofits. Eligible organizations
  can use ten seats for free, with any additional seats enjoying a 70% discount
  off the standard plan price.


  ## Integrations


  The platform integrates with numerous software solutions, including
  Givebutter's monday.com integration, which syncs donor and campaign data
  between your Givebutter dashboard and monday.com's fundraising boards.


  ## Use Cases


  Planning, tracking, and analyzing fundraising campaigns; task and event
  management; donor and volunteer management; grant management.
