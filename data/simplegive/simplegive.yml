markdown: >-
  ## Overview


  SimpleGive is an easy-to-use platform for churches and non-profits to manage
  donations seamlessly. It offers various ways to give—online, by text, or even
  through a kiosk—and all options are secure and customizable to fit the
  organization's brand, with helpful tools for tracking and reporting donations.


  ## Features


  - Matching Gifts

  - Fund Management

  - Customizable Forms

  - Mobile Giving

  - Donor Database

  - Volunteer Management

  - Event Registration

  - Payment Processing

  - Online Giving

  - Text Giving

  - Kiosk Giving

  - Donation Tracking and Reporting


  ## Pricing


  Pricing is not publicly listed on the vendor website; contact the vendor for a
  quote.


  ## Deployment


  Cloud-based SaaS platform.


  ## Audience


  Startups, SMBs, mid-market, and enterprises.
