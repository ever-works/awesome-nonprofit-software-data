markdown: >-
  ## Overview


  Primero is an open-source application designed to help child protection
  workers and social workers in humanitarian and development contexts manage
  data on vulnerable children and survivors of violence.


  ## Key Features


  - Case management for child protection

  - Data management on vulnerable children

  - Incident tracking

  - Open source (self-hosted)


  ## Pricing


  Free and open-source.


  ## License


  Open source


  ## Repository


  https://github.com/primeroIMS/primero
