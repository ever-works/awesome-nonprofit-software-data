markdown: >-
  ## Overview


  Silent Auction Pro enables nonprofits to host impactful auctions and events,
  but it also offers a range of other fundraising features.


  ## Features


  - Auction catalog

  - Paddle raising

  - Buy-it-now feature

  - Donation tracking

  - Event ticketing

  - Marketing and communications


  ## Pricing


  Silent Auction Pro's pricing starts at $749 per year for virtual, hybrid, and
  in-person events, or $449 per year for in-person-only features.


  ## Integrations


  - DocHub


  ## Deployment


  Cloud-based SaaS platform.
