markdown: >-
  ## Overview


  Nextcloud is an awesome self-hosted full GSuite alternative with encryption
  and collaboration suite. It provides file storage, collaboration tools,
  calendar, contacts, and productivity applications for nonprofit organizations.


  ## Key Features


  - File storage and synchronization

  - Collaboration suite (documents, spreadsheets, presentations)

  - Calendar and contacts

  - Encryption

  - Self-hosted deployment

  - Open source


  ## Pricing


  Free and open-source under the GNU Affero General Public License v3.


