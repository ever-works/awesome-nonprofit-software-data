markdown: >-
  ## Overview


  WordPress is the world's most famous open-source content management system
  (CMS). It provides website creation, content publishing, themes, and plugin
  extensibility for nonprofit organizations building websites, blogs, and
  donation portals.


  ## Key Features


  - Content creation and publishing

  - Themes and plugins

  - Media management

  - User management

  - Open source (self-hosted)


  ## Pricing


  Free and open-source under the GNU General Public License v2.


  ## License


  GNU General Public License v2 (GPLv2)


  ## Repository


  https://github.com/WordPress/wordpress
