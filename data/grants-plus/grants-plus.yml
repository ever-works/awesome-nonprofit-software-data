markdown: >-
  ## Overview


  Grants Plus is a grants platform that combines strategic consulting with tools
  and processes to help nonprofits build a stronger, more sustainable
  grant-seeking program.


  ## Features


  - Grant prospect research and prioritization

  - Proposal strategy and writing support

  - Help manage complex and federal grants

  - Coaching to strengthen internal grant processes

  - Ongoing partnership to grow long-term grant revenue


  ## Pricing


  Pricing is not listed publicly; nonprofits request a consultation to receive a
  customized quote based on their goals and level of support needed.


  ## Deployment


  Cloud-based service platform.
