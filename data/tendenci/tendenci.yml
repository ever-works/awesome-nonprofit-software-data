markdown: >-
  ## Overview


  Tendenci is free and open-source association management software designed for
  nonprofits and associations. It includes membership management, recurring
  donations, event management, website builder, human resources management, and
  many more features.


  ## Key Features


  - Membership management

  - Recurring donations

  - Event management

  - Website builder

  - Human resources management

  - Open source (self-hosted)


  ## Pricing


  Free and open-source. Self-hosted deployment.


  ## License


  Open source.
