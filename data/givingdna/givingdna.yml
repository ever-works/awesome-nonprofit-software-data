markdown: >-
  ## Overview


  GivingDNA is a wealth screening tool that nonprofits can use to gain deeper
  insights about their donors.


  ## Features


  - Wealth screening

  - Moves management

  - Portfolio optimization

  - Reporting

  - Analytics

  - Data visualization


  ## Pricing


  GivingDNA's pricing is based on the number of records you have, but the price
  isn't listed publicly online.


  ## Integrations


  - Salesforce

  - Blackbaud NXT

  - Virtuous


  ## Deployment


  Cloud-based SaaS platform.
