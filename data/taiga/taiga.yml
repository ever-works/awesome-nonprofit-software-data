markdown: >-
  ## Overview


  Taiga is an open-source project management platform for agile development
  teams. It supports Kanban and Scrum methodologies with backlog management,
  issue tracking, sprint planning, and collaboration features.


  ## Key Features


  - Kanban and Scrum boards

  - Product backlog management

  - Issue tracking

  - Sprint planning

  - Epics and user stories

  - Open source (self-hosted option available)


  ## Pricing


  Free and open-source. Cloud and self-hosted deployment options available.


  ## License


  Open source
