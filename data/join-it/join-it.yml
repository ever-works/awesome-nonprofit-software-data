markdown: >-
  ## Overview


  Join It is a simple, modern membership management platform built for
  nonprofits that want an intuitive, no-frills way to manage members.


  ## Features


  - Custom membership levels and pricing

  - Automated renewals and reminders

  - Member directory and profiles

  - Integrated payment processing

  - Event and ticketing connections


  ## Pricing


  Plans start at $29/month, with pricing based on the number of members and
  automation needs.


  ## Integrations


  - Eventbrite

  - Mailchimp

  - Constant Contact

  - Stripe

  - Zapier


  ## Deployment


  Cloud-based SaaS platform.
