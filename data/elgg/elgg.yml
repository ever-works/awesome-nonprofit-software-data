markdown: >-
  ## Overview


  Elgg is a well-documented, free and open-source social intranet software. It
  provides social networking, content sharing, and collaboration tools for
  organizations and communities.


  ## Key Features


  - Social networking

  - Content sharing

  - User profiles and groups

  - Activity streams

  - Open source (self-hosted)


  ## Pricing


  Free and open-source under the GNU General Public License v2.


  ## License


  GNU General Public License v2 (GPLv2)


  ## Repository


  https://github.com/Elgg/Elgg
