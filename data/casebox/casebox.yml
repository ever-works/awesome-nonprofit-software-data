  Casebox is open-source case management and organization-wide collaboration
  software. It helps organizations manage cases, records, and collaborative
  workflows across teams.


  ## Key Features


  - Case management

  - Document management

  - Organization-wide collaboration

  - Task and workflow management

  - Open source (self-hosted)


  ## Pricing


  Free and open-source.


