markdown: >-
  ## Overview


  HumHub is semi open-source social intranet software. It provides social
  networking, collaboration, and communication tools for organizations including
  nonprofits and NGOs.


  ## Key Features


  - Social networking for organizations

  - Activity streams

  - Spaces and groups

  - File sharing

  - Open source core (self-hosted)


  ## Pricing


  Free and open-source core. Paid cloud hosting and enterprise options
  available.


  ## License


  Open source
