markdown: >-
  ## Overview


  Wild Apricot is a payment processing and membership management software that
  allows organizations to take and track online and offline payments and manage
  their finances securely. It supports automatic recurring payments and multiple
  sales taxes.


  ## Target Audience


  - StartUps

  - SMBs

  - Mid-Market

  - Enterprises


  ## Features


  - Event Registration Payments

  - Refund Management

  - Software Integration

  - Automated Receipts

  - Payment Reminders

  - Email Notifications

  - Secure Transactions

  - Online Payments


  ## Pricing


  - Free: $0/month

  - Group: $40/month

  - Community: $70/month

  - Professional: $130/month


  ## User Satisfaction Scores


  - Freshness Score: 9.5 out of 10

  - Social Score: 5.0 out of 10
