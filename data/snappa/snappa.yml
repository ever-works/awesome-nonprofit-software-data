name: Snappa
description: Snappa is an online graphic design tool that lets users create web
  and social media assets quickly using templates and built-in graphics. It
  includes a background remover, image resizing, and integrates with social
  media tools such as Buffer to streamline design and publishing. Pricing offers
  a free plan limited to three downloads per month; the Pro plan is $10 per
  month for unlimited downloads, custom fonts, and advanced features.
