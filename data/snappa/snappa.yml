markdown: >-
  ## Overview


  Snappa allows users to create design elements for the web in no time using
  templates and built-in graphics. Fundraisers can benefit from a library of
  premade assets to customize and share on social media quickly.


  ## Key Features


  - Templates

  - High-quality graphics and photos

  - Background remover

  - Image resizing


  ## Pricing


  Snappa has a free plan limited to three downloads per month. The Pro plan is
  $10 per month for unlimited downloads, custom fonts, and advanced design
  features.


  ## Integrations


  Snappa integrates with social media tools such as Buffer to make the design
  and publishing workflow simple.


  ## Use Cases


  Fundraisers can create graphics in minutes to share on social media without
  worrying about design details.
