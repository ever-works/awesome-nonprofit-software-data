markdown: >-
  ## Overview


  Loomio is free and open-source collaborative decision making and forum
  software. It enables teams and organizations to discuss proposals, make
  decisions, and keep records of discussions in a transparent way.


  ## Key Features


  - Collaborative decision making

  - Discussion forums

  - Proposal and voting tools

  - Decision recording

  - Open source (self-hosted)


  ## Pricing


  Free and open-source under the GNU Affero General Public License v3.


