markdown: >-
  ## Overview


  TYPO3 is a fully featured and reliable, free, open-source enterprise content
  management system (CMS). It provides enterprise-grade content management,
  multi-site capabilities, workflow management, and extensibility for large
  nonprofit organizations.


  ## Key Features


  - Enterprise content management

  - Multi-site and multi-language support

  - Workflow management

  - Extensible architecture

  - Open source (self-hosted)


  ## Pricing


  Free and open-source under the GNU General Public License v2.


  ## License


  GNU General Public License v2 (GPLv2)


  ## Repository


  https://github.com/TYPO3/typo3
