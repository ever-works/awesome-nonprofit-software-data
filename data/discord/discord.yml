markdown: >-
  ## Overview


  Discord is a group chat app popular with gamers and online communities, but it
  can also be used as an internal communications tool. It offers nonprofit teams
  a more casual way to connect, ideal for hopping in and out of voice channels
  or text conversations.


  ## Key Features


  - Group chats and channels

  - Text and voice chat

  - Emojis, stickers, and soundboard effects

  - Streaming

  - Online statuses


  ## Pricing


  Discord is free to use, but you can pay for upgrades to enhance your
  experience.


  ## Integrations


  You can use Zapier to connect Discord to a range of apps such as Google
  Calendar, Trello, and Notion.


  ## Use Cases


  Casual internal team communication for nonprofits that want a streamlined
  Slack alternative.
