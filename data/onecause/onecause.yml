markdown: >-
  ## Overview


  OneCause is a fundraising platform that specializes in events and auctions.


  ## Features


  - Event ticketing and registration

  - QR code check-ins

  - Auction item gallery

  - Competitive bidding

  - Scorecards and slideshows

  - Real-time analytics


  ## Pricing


  OneCause's pricing is available on a per-quote basis, with different plans
  based on your specific goals and needs.


  ## Integrations


  - DonorDock

  - Double the Donation

  - Virtuous


  ## Deployment


  Cloud-based SaaS platform.
