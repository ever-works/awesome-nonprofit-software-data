markdown: >-
  ## Overview


  MapSwipe is a mobile application that enables volunteers to help humanitarian
  organizations map vulnerable populations by reviewing satellite imagery. The
  app supports the Missing Maps project, which aims to put the world's
  vulnerable people on the map.


  ## Key Features


  - Mobile application for iOS and Android

  - Satellite imagery review and mapping

  - Volunteer tasking and contribution tracking

  - Support for Missing Maps and humanitarian response

  - Open source codebase


  ## Deployment


  Cloud-based with mobile clients for volunteer contributors.


  ## Integrations


  - Missing Maps platform

  - Humanitarian OpenStreetMap Team (HOT)

  - Médecins Sans Frontières (MSF)

  - British Red Cross


  ## Pricing


  Free and open source.
