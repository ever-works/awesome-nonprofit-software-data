description: MapSwipe is a mobile application that enables volunteers to support
  humanitarian organizations by reviewing satellite imagery to map vulnerable
  populations. It is used by the Missing Maps project and organizations such as
  Médecins Sans Frontières and the British Red Cross to locate people and
  infrastructure in unmapped areas.
