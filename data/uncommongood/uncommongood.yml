markdown: >-
  ## Overview


  UncommonGood is an innovative software designed to streamline nonprofit
  operations, offering intuitive tools for fundraising, donor management, and
  event planning. Its user-friendly interface and robust analytics empower
  organizations to maximize impact and efficiency.


  ## Target Audience


  - StartUps

  - SMBs

  - Mid-Market

  - Enterprises


  ## Features


  - Customizable Forms

  - Reporting And Analytics

  - Donor Management

  - Text To Give

  - Event Management

  - Social Media

  - Peer To Peer Fundraising

  - Email Marketing


  ## Pricing Model


  Paid software with three tiers:

  - Starter: $25 Per Month

  - Essential: $75 Per Month

  - Premium: $125 Per Month
