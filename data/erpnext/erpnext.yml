markdown: >-
  ## Overview


  ERPNext is an open-source fully featured ERP written in Python. It provides
  accounting, inventory, project management, CRM, and other business management
  capabilities that can be used by nonprofit organizations.


  ## Key Features


  - Accounting and financial management

  - Inventory management

  - Project management

  - Customer relationship management

  - Open source (self-hosted)

  - Python-based


  ## Pricing


  Free and open-source under the GNU General Public License v3. Self-hosted
  deployment.


  ## License


  GNU General Public License v3 (GPLv3)


