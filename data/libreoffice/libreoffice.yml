markdown: >-
  ## Overview


  LibreOffice is a full, open-source office suite providing word processing,
  spreadsheets, presentations, drawings, and database tools for nonprofit
  organizations as a free alternative to proprietary office software.


  ## Key Features


  - Writer (word processing)

  - Calc (spreadsheets)

  - Impress (presentations)

  - Draw (vector graphics)

  - Base (database)

  - Open source (self-hosted/desktop)


  ## Pricing


  Free and open-source under the Mozilla Public License 2.0.


  ## License


  Mozilla Public License 2.0 (MPL 2.0)


  ## Repository


  https://git.libreoffice.org/
