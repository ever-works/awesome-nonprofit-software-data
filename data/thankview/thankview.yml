markdown: >-
  ## Overview


  ThankView offers personalized video appeals to help nonprofits engage their
  audience and increase donation rates.


  ## Features


  - Built-in video editor

  - Overlays and banners

  - Branded landing pages

  - Digital envelopes

  - Video requests

  - Metrics and reporting


  ## Pricing


  ThankView's pricing isn't available online—to get started, contact their sales
  team.


  ## Integrations


  ThankView integrates with plenty of fundraising apps and tools, including
  Givebutter.


  ## Deployment


  Cloud-based SaaS platform.
