markdown: >-
  ## Overview


  GoFundMe Pro is an online fundraising platform designed for nonprofits to
  personalize their outreach at scale.


  ## Features


  - Donation forms

  - Peer-to-peer fundraising

  - Event ticketing and registration

  - Auctions and mobile bidding

  - Recurring giving

  - Crowdfunding

  - Donation websites


  ## Pricing


  Pricing isn't available online; nonprofits request a demo for a custom quote,
  with packages adjusted to organization needs.


  ## Integrations


  - DonorDock

  - DonorPerfect

  - Double the Donation

  - Zapier (higher-tier plans)


  ## Deployment


  Cloud-based SaaS platform.
