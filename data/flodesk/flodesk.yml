markdown: >-
  ## Overview


  Flodesk is an email marketing platform that helps nonprofits create
  eye-catching signup forms, emails, and digital newsletters. Teams can use it
  to launch list-building forms and automate welcome sequences.


  ## Key Features


  - Email templates

  - Email scheduling

  - Signup forms

  - Landing pages

  - Custom fonts

  - Segmentation

  - Custom fields

  - Data analytics


  ## Pricing


  Limited features are available for free. Email marketing plans start at $38
  per month.


  ## Integrations


  Flodesk integrates with popular web tools such as Shopify, WordPress, and
  Slack.


  ## Use Cases


  Fundraisers can build signup forms, automate welcome sequences for new
  supporters, and create newsletters for email campaigns.
