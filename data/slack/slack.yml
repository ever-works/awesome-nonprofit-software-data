markdown: >-
  ## Overview


  Slack gives nonprofit team members a simple method to stay in touch, wherever
  they are, helping teams avoid missing messages, opportunities, and roadblocks.


  ## Key Features


  - Asynchronous and real-time team communication

  - Open and private communication channels

  - User profiles

  - Tags and comment threads

  - Direct messages


  ## Pricing


  Businesses normally pay a monthly fee for Slack's Pro subscription. Eligible
  nonprofits can request a Slack for Charities discount that offers a free Pro
  upgrade for the first 250 workspace members and an 85% discount for workspaces
  above that size.


  ## Integrations


  Many other software tools integrate with Slack so you can get updates and
  share data within the tool, including Givebutter's Slack integration via
  Zapier.


  ## Use Cases


  Team coordination for in-person, hybrid, and remote nonprofit teams;
  coordinating programs, collaborating on grants, and keeping remote volunteers
  in the loop.
