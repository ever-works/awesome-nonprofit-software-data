markdown: >-
  ## Overview


  OpenMRS is a free and open-source medical record system (EMR/EHR platform). It
  provides electronic medical records functionality for healthcare organizations
  in resource-constrained environments, particularly in developing countries.


  ## Key Features


  - Electronic medical records

  - Patient management

  - Clinical workflows

  - Modular architecture

  - Open source (self-hosted)


  ## Pricing


  Free and open-source under the Mozilla Public License 2.0.


  ## License


  Mozilla Public License 2.0 (MPL 2.0)


