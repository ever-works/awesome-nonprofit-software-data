markdown: >-
  ## Overview


  GrantHub is a dedicated grant management tool that helps nonprofits track
  deadlines, tasks, and relationships for every grant in one place.


  ## Features


  - Grant deadline and task tracking

  - Centralized grant and funder records

  - Document storage and version history

  - Activity tracking and reminders

  - Reporting on submissions, awards, and success rates


  ## Pricing


  Pricing typically starts around $95 per month, with higher-tier plans
  available for larger teams and more advanced needs.


  ## Deployment


  Cloud-based SaaS platform.
