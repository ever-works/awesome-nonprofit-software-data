markdown: >-
  ## Overview


  Notion is a highly customizable workspace, collaboration, and project
  management tool. Nonprofit teams can use Notion to manage not only fundraising
  or marketing campaigns but also their overall business operations.


  ## Key Features


  - Project management

  - Task management

  - Document management

  - Wiki feature

  - Built-in AI assistant


  ## Pricing


  Notion is free for individuals. Plans for small teams and businesses start at
  around $11 monthly per user.


  ## Integrations


  Notion has more than 100 native integrations, including tools like Canva,
  Google Drive, and Dropbox.


  ## Use Cases


  Managing fundraising and marketing campaigns, business operations,
  documentation, and team collaboration for nonprofit teams.
