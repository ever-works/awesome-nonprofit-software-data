markdown: >-
  ## Overview


  Canva is a design platform that makes graphic design accessible through an
  intuitive, non-technical interface. Nonprofits can customize templates to
  craft engaging graphics for email campaigns, social media campaigns, digital
  ads, and more.


  ## Key Features


  - Built-in templates and graphic elements

  - Document creation

  - Presentations and whiteboards

  - Photo and video editor

  - AI image generator

  - Brand and asset management


  ## Pricing


  Canva operates on a freemium model with basic features available for free.
  Eligible nonprofits can enjoy Canva's premium features for free through Canva
  for Nonprofits.


  ## Integrations


  Canva integrates with many tools to streamline creative workflows, including
  Givebutter's built-in Canva integration.


  ## Use Cases


  Nonprofits use Canva to design graphics for email campaigns, social media
  campaigns, digital ads, presentations, and print materials.
