description: Canva is an online design platform that provides templates and a
  drag-and-drop editor for creating graphics, presentations, documents, and
  video for email, social, web, and print. Eligible nonprofits can access
  Canva's premium features at no cost through Canva for Nonprofits; otherwise
  the platform operates on a freemium model with a paid premium tier. It
  integrates with many tools, including Givebutter's built-in Canva integration.
