markdown: >-
  ## Overview


  Kittl is a simplified online design tool for creatives and businesses that
  want to quickly create graphics for online, print, and products. It is
  especially useful for nonprofits that want to add print-on-demand branded
  merch to their online store.


  ## Key Features


  - Design templates

  - Exclusive fonts

  - Text effects

  - Product mockups

  - Image editing

  - Moodboards


  ## Pricing


  Kittl has a free plan. Paid plans cost around $18 per month to access premium
  content, graphics, and fonts.


  ## Integrations


  It is not clear whether Kittl has direct integrations, but it can be used
  alongside tools within the design and product workflow, such as Etsy and
  Printify.


  ## Use Cases


  Creating graphics for online, print, and products, including print-on-demand
  branded merch for nonprofit online stores.
